name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy PyYAML pandas scipy scikit-learn

      - name: Unit tests (no MPI)
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -m "not mpi" --ignore=tests/test_phase4_unit.py --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff (new framework modules)
        run: |
          pip install ruff
          ruff check \
            src/cli.py \
            src/utils/run_config.py \
            src/utils/rng.py \
            src/utils/model_config_patch.py \
            tests/test_distance.py \
            tests/test_speciation_config.py \
            tests/test_run_config.py \
            tests/test_rng.py \
            tests/test_cli.py \
            --ignore E501
